[build]
  publish = "analysis-app/public"

[[redirects]]
  from = "/analysis"
  to = "/analysis.html"
  status = 200

[[redirects]]
  from = "/analysis/"
  to = "/analysis.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://dmaihxcai.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

